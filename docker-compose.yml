name: verity

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Local small model for wording answers; anything in .env overrides these.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
    volumes:
      - ./data:/app/data
    depends_on:
      llm:
        condition: service_started
    restart: unless-stopped

  # Ollama serving a ~1 GB model on CPU. No host port: only the app can reach it.
  # Verity still answers (quoting the document) while the model downloads or if it's down.
  llm:
    image: ollama/ollama:0.5.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull ${LLM_MODEL:-qwen2.5:1.5b-instruct}
        wait
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - llm-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "show", "${LLM_MODEL:-qwen2.5:1.5b-instruct}"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

volumes:
  llm-models:
